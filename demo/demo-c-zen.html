<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Demo C - Zen Style</title>
    <style>
        :root {
            --bg: #f5f3ed;
            --text-main: #4a453f;
            --text-muted: #8c867c;
            --accent: #bda28b;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'PingFang SC', 'Hiragino Sans GB', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }

        /* 宣纸感噪点纹理 */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        .canvas {
            width: 90%;
            max-width: 1000px;
            padding: 10vh 5vw;
            position: relative;
        }

        /* 非对称几何装饰 */
        .decor-circle {
            position: absolute;
            top: 5vh;
            right: 15vw;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, transparent, rgba(189, 162, 139, 0.15));
            z-index: -1;
            filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            margin-bottom: 4rem;
            color: var(--text-main);
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 20px;
            height: 2px;
            background-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6rem;
            margin-top: 6rem;
            padding-left: 0;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 8vw;
                padding-left: 10vw; /* 不对称偏移 */
            }
            .grid .item:nth-child(2) {
                margin-top: 15vh; /* 错落排列 */
            }
        }

        .item p {
            line-height: 2.2;
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .item h3 {
            font-weight: 400;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .read-more {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
            transition: color 0.4s ease;
        }

        .read-more:hover {
            color: var(--accent);
        }

    </style>
</head>
<body>
    <div class="decor-circle"></div>
    <div class="canvas">
        <h1>静与空 / Silence & Void</h1>
        
        <div class="grid">
            <div class="item">
                <h3>呼吸感 (Breathing Space)</h3>
                <p>极简并不是简单的空无一物，而是恰到好处的留白。通过非对称的布局和宽大的边距，赋予内容一种缓慢流动的节奏。色彩退居其次，重点在于材质的感知与光影的微弱变化。</p>
                <a href="#" class="read-more">阅读更多</a>
            </div>
            
            <div class="item">
                <h3>不完美 (Imperfection)</h3>
                <p>摒弃绝对的对称和高饱和的刺激。柔和的噪点纹理就像宣纸的质地，文字如同落在上面的墨迹。一切看起来像是顺其自然发生的，没有强烈的侵略性，保留了大地色系的温和。</p>
                <a href="#" class="read-more">阅读更多</a>
            </div>
        </div>
    </div>
</body>
</html>
